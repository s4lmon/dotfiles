# BEGIN_KITTY_THEME
# Sunset Light
include themes/doom-rouge.conf
# END_KITTY_THEME

# Shell configuration
shell /usr/bin/zsh

# Font configuration
font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0
disable_ligatures never

# DM Mono has no icon glyphs — pull Nerd Font symbols (powerline, devicons,
# codicons, font-awesome, etc.) from JetBrainsMono Nerd Font
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58 JetBrainsMono Nerd Font
symbol_map U+E000-U+E00A JetBrainsMono Nerd Font
symbol_map U+E0A0-U+E0A3,U+E0B0-U+E0D4 JetBrainsMono Nerd Font
symbol_map U+E200-U+E2A9 JetBrainsMono Nerd Font
symbol_map U+E300-U+E3E3 JetBrainsMono Nerd Font
symbol_map U+E5FA-U+E6B7 JetBrainsMono Nerd Font
symbol_map U+E700-U+E8EF JetBrainsMono Nerd Font
symbol_map U+EA60-U+EC1E JetBrainsMono Nerd Font
symbol_map U+ED00-U+EFCE JetBrainsMono Nerd Font
symbol_map U+F000-U+F2FF JetBrainsMono Nerd Font
symbol_map U+F300-U+F381 JetBrainsMono Nerd Font
symbol_map U+F400-U+F533 JetBrainsMono Nerd Font
symbol_map U+F0001-U+F1AF0 JetBrainsMono Nerd Font

# Disable close confirmation warning
confirm_os_window_close 0

# Strip trailing whitespace/newlines when copying
strip_trailing_spaces always

# Copy mouse-selected text straight to the system clipboard
copy_on_select clipboard

# Platform overrides must follow shared defaults.
include ${KITTY_OS}.conf
