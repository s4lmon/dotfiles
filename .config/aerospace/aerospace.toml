config-version = 2
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

# Reference: https://github.com/i3/i3/blob/next/etc/config

# i3 doesn't have "normalizations" feature that why we disable them here.
# But the feature is very helpful.
# Normalizations eliminate all sorts of weird tree configurations that don't make sense.
# Give normalizations a chance and enable them back.
start-at-login = true

# Run Sketchybar together with AeroSpace
# sketchybar has a built-in detection of already running process,
# so it won't be run twice on AeroSpace restart
after-startup-command = [
    'exec-and-forget sketchybar',
    'exec-and-forget ~/.config/sketchybar/plugins/window_watcher.sh'
]

# Notify Sketchybar about workspace change
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE && ~/.config/sketchybar/plugins/update_workspace_icons.sh'
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true


# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']


# Share workspaces across all monitors
[workspace-to-monitor-force-assignment]

[mode.main.binding]
    # See: https://nikitabobko.github.io/AeroSpace/goodies#open-a-new-window-with-applescript
    alt-enter = 'exec-and-forget open -na Kitty'

    # i3 wraps focus by default
    alt-h =         'focus left'
    alt-l =         'focus right'
    alt-j =         'focus down'
    alt-k =         'focus up'
    alt-q =         'close'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Consider using 'join-with' command as a 'split' replacement if you want to enable
    # normalizations
    #alt-m = 'join-with horizontal'
    #alt-v = 'join-with vertical'
    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-f = 'fullscreen'

    alt-s = 'layout v_accordion' # 'layout stacking' in i3
    alt-w = 'layout h_accordion' # 'layout tabbed' in i3
    alt-e = 'layout tiles horizontal vertical'
    alt-shift-e = 'exec-and-forget ~/.local/bin/emacs-launch' # Doom via emacsclient

    alt-shift-space = 'layout floating tiling' # 'floating toggle' in i3

    # Not supported, because this command is redundant in AeroSpace mental model.
    # See: https://nikitabobko.github.io/AeroSpace/guide#floating-windows
    #alt-space = 'focus toggle_tiling_floating'

    # `focus parent`/`focus child` are not yet supported, and it's not clear whether they
    # should be supported at all https://github.com/nikitabobko/AeroSpace/issues/5
    # alt-a = 'focus parent'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'

    alt-shift-c = 'reload-config'
    alt-tab = 'workspace-back-and-forth'

    alt-r = 'mode resize'
 # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-semicolon = 'mode service'

    # Additional monitor and workspace navigation from the shared config.
    alt-left = 'focus-monitor left'
    alt-down = 'focus-monitor down'
    alt-up = 'focus-monitor up'
    alt-right = 'focus-monitor right'
    alt-ctrl-shift-h = 'focus-monitor left'
    alt-ctrl-shift-j = 'focus-monitor down'
    alt-ctrl-shift-k = 'focus-monitor up'
    alt-ctrl-shift-l = 'focus-monitor right'
    alt-shift-left = 'move-node-to-monitor left'
    alt-shift-down = 'move-node-to-monitor down'
    alt-shift-up = 'move-node-to-monitor up'
    alt-shift-right = 'move-node-to-monitor right'
    alt-u = 'workspace --wrap-around next'
    alt-i = 'workspace --wrap-around prev'
    alt-ctrl-j = 'workspace --wrap-around next'
    alt-ctrl-k = 'workspace --wrap-around prev'
    alt-ctrl-u = 'move-node-to-workspace --focus-follows-window --wrap-around next'
    alt-ctrl-i = 'move-node-to-workspace --focus-follows-window --wrap-around prev'
    alt-shift-u = 'move-node-to-workspace --focus-follows-window --wrap-around next'
    alt-shift-i = 'move-node-to-workspace --focus-follows-window --wrap-around prev'

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    enter = 'mode main'
    esc = 'mode main'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']
