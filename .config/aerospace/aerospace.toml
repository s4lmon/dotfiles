start-at-login = true
after-startup-command = [
  'exec-and-forget borders',
  'exec-and-forget ~/.local/bin/emacs-launch --ensure-daemon',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${HOME}/.local/bin:${PATH}'

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]
alt-enter = 'exec-and-forget /Applications/kitty.app/Contents/MacOS/kitty --single-instance -d ~'
alt-e = 'exec-and-forget ~/.local/bin/emacs-launch'
alt-q = 'close'

alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
alt-l = 'focus --boundaries-action wrap-around-the-workspace right'
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-left = 'focus-monitor left'
alt-down = 'focus-monitor down'
alt-up = 'focus-monitor up'
alt-right = 'focus-monitor right'
alt-ctrl-shift-h = 'focus-monitor left'
alt-ctrl-shift-j = 'focus-monitor down'
alt-ctrl-shift-k = 'focus-monitor up'
alt-ctrl-shift-l = 'focus-monitor right'
alt-shift-left = 'move-node-to-monitor left'
alt-shift-down = 'move-node-to-monitor down'
alt-shift-up = 'move-node-to-monitor up'
alt-shift-right = 'move-node-to-monitor right'

alt-u = 'workspace --wrap-around next'
alt-i = 'workspace --wrap-around prev'
alt-ctrl-j = 'workspace --wrap-around next'
alt-ctrl-k = 'workspace --wrap-around prev'
alt-ctrl-u = 'move-node-to-workspace --wrap-around next'
alt-ctrl-i = 'move-node-to-workspace --wrap-around prev'
alt-shift-u = 'move-node-to-workspace --wrap-around next'
alt-shift-i = 'move-node-to-workspace --wrap-around prev'
alt-tab = 'workspace-back-and-forth'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 0'
alt-ctrl-1 = 'move-node-to-workspace 1'
alt-ctrl-2 = 'move-node-to-workspace 2'
alt-ctrl-3 = 'move-node-to-workspace 3'
alt-ctrl-4 = 'move-node-to-workspace 4'
alt-ctrl-5 = 'move-node-to-workspace 5'
alt-ctrl-6 = 'move-node-to-workspace 6'
alt-ctrl-7 = 'move-node-to-workspace 7'
alt-ctrl-8 = 'move-node-to-workspace 8'
alt-ctrl-9 = 'move-node-to-workspace 9'
alt-ctrl-0 = 'move-node-to-workspace 0'

alt-f = 'fullscreen'
alt-shift-f = 'layout floating tiling'
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-r = 'balance-sizes'
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']
