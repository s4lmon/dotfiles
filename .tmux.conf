set -g mouse on
set -g default-terminal "tmux-256color"
set -sg escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# Ctrl+Space is the leader; press it twice to pass a literal Ctrl+Space through
# A bare Ctrl tap also works: keyd turns it into Alt+F12, which only tmux cares about
unbind C-b
set -g prefix C-Space
set -g prefix2 M-F12
bind C-Space send-prefix

bind : command-prompt
bind Space command-prompt
bind ? list-keys -N
bind R source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Panes are Doom windows: hjkl focus, HJKL resize, 1-9 jump (Spacemacs winum)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind 1 select-pane -t 1
bind 2 select-pane -t 2
bind 3 select-pane -t 3
bind 4 select-pane -t 4
bind 5 select-pane -t 5
bind 6 select-pane -t 6
bind 7 select-pane -t 7
bind 8 select-pane -t 8
bind 9 select-pane -t 9
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind d kill-pane
bind m resize-pane -Z

# Same again with Ctrl still held, so C-Space C-h works
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R
bind C-v split-window -h -c "#{pane_current_path}"
bind C-s split-window -v -c "#{pane_current_path}"
bind C-w switch-client -T win
bind C-b switch-client -T buf
bind C-t switch-client -T ws
bind C-p switch-client -T proj

# SPC w: Doom window commands
bind w switch-client -T win
bind -T win h select-pane -L
bind -T win j select-pane -D
bind -T win k select-pane -U
bind -T win l select-pane -R
bind -T win w select-pane -t :.+
bind -T win v split-window -h -c "#{pane_current_path}"
bind -T win s split-window -v -c "#{pane_current_path}"
bind -T win d kill-pane
bind -T win m resize-pane -Z
bind -T win = select-layout -E
bind -T win r rotate-window
bind -T win x swap-pane -D
bind -T win X swap-pane -U
bind -T win b break-pane

# Windows are Doom buffers: SPC b ...
bind B choose-tree -Zw
bind ` last-window
bind ] next-window
bind [ previous-window
bind b switch-client -T buf
bind -T buf b choose-window -Z
bind -T buf n next-window
bind -T buf p previous-window
bind -T buf N new-window -c "#{pane_current_path}"
bind -T buf d confirm-before -p "kill window #W? (y/n)" kill-window
bind -T buf r command-prompt -I "#W" "rename-window '%%'"

# SPC t: Doom workspace commands (SPC TAB clashes with the command prompt)
bind t switch-client -T ws
bind -T ws n new-window -c "#{pane_current_path}"
bind -T ws d confirm-before -p "kill window #W? (y/n)" kill-window
bind -T ws r command-prompt -I "#W" "rename-window '%%'"
bind -T ws . choose-window -Z
bind -T ws ] next-window
bind -T ws [ previous-window
bind -T ws 1 select-window -t 1
bind -T ws 2 select-window -t 2
bind -T ws 3 select-window -t 3
bind -T ws 4 select-window -t 4
bind -T ws 5 select-window -t 5
bind -T ws 6 select-window -t 6
bind -T ws 7 select-window -t 7
bind -T ws 8 select-window -t 8
bind -T ws 9 select-window -t 9

# Sessions are Doom projects: SPC p p switch, SPC q q detach
bind p switch-client -T proj
bind -T proj p choose-tree -Zs
bind -T proj n command-prompt -p "new session:" "new-session -s '%%'"
bind -T proj r command-prompt -I "#S" "rename-session '%%'"
bind q switch-client -T quit
bind -T quit q detach
bind -T quit K confirm-before -p "kill session #S? (y/n)" kill-session

# Copy mode: SPC Esc enters, v/y select and yank to clipboard, SPC P pastes
bind Escape copy-mode
bind P paste-buffer
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# Status bar layout; colours come from the Doom theme via kitty-theme.el
set -g status-left " #S "
set -g status-right " %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
source-file -q ~/.config/tmux/theme.conf
